# display-posta su ESP32-C6 (Waveshare ESP32-C6-LCD-1.47):
# LCD ST7789V, BLE proxy + ingest bilancia, HA API, OTA
# + OpenThread Border Router (componente SPERIMENTALE, ESP-IDF >= 5.5.5).
#
# Secret richiesti in ESPHome → Secrets:
#   wifi_ssid, wifi_password, display_posta_ap_password  (già presenti)
#   miscale_mac, miscale_token                          (già presenti)
#   thread_tlv                                          (NUOVO: TLV rete Thread da HA)
#
# Nota: nella config live puoi tenere token e MAC letterali; qui restano come
# !secret per non pubblicare credenziali nel repository.

substitutions:
  # --- PROFILI BILANCIA: personalizza nomi e soglia ---
  profile_light_name: "Profilo 1"   # peso < soglia
  profile_heavy_name: "Profilo 2"   # peso >= soglia
  profile_threshold: "70.0"         # kg

esphome:
  name: "display-posta"
  friendly_name: Oled
  on_boot:
    priority: -100
    then:
      - light.turn_on: back_light
      - lambda: |-
          id(splash_active) = true;
          id(my_display).show_page(id(page_splash));
          id(my_display).update();
      - delay: 4s
      - lambda: |-
          id(splash_active) = false;
          id(my_display).show_page(id(page_standby));
          id(my_display).update();
      - light.turn_off: back_light

esp32:
  board: esp32-c6-devkitc-1
  flash_size: 8MB
  framework:
    type: esp-idf

# IPv6 obbligatorio: il border router usa il Wi-Fi come backbone.
network:
  enable_ipv6: true

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: hpUZC7AO4Z04p99TbwcPvLahZF9ahq2MD0LK3Qt/6KE=
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: false
  use_address: 192.168.4.150
  manual_ip:
    static_ip: 192.168.4.150
    gateway: 192.168.4.1
    subnet: 255.255.255.0
    dns1: 192.168.4.1

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Esphome-Web-745428"
    password: !secret display_posta_ap_password

captive_portal:

# OpenThread Border Router (SPERIMENTALE): la radio 802.15.4 interna della C6
# fa da BR, il Wi-Fi STA è la backbone verso la LAN. Con il TLV si aggancia
# alla rete Thread preferita di Home Assistant.
openthread:
  border_router:
  device_type: FTD
  tlv: !secret thread_tlv
  force_dataset: true

# Bluetooth Proxy
bluetooth_proxy:
  active: true

http_request:
  timeout: 2s
  verify_ssl: false

esp32_ble_tracker:
  on_ble_service_data_advertise:
    - service_uuid: 181B
      mac_address: 5C:CA:D3:5D:8D:8D
      then:
        - if:
            condition:
              and:
                - wifi.connected:
                - lambda: |
                    if (x.size() != 13) return false;
                    char hex[27] = {0};
                    for (size_t i = 0; i < 13; i++) {
                      snprintf(hex + i * 2, 3, "%02x",
                               static_cast<unsigned int>(x[i]));
                    }
                    if (id(miscale_last_hex) == hex) return false;
                    id(miscale_last_hex) = hex;
                    return true;
            then:
              - http_request.post:
                  url: http://192.168.188.163:8800/api/ingest
                  request_headers:
                    Content-Type: application/json
                    X-Ingest-Token: !secret miscale_token
                  json:
                    data: !lambda return id(miscale_last_hex);
                    mac: !secret miscale_mac
              # --- decode dati bilancia per il display ---
              - light.turn_on: back_light
              - lambda: |-
                  // x[0]: bit5=stabilized, bit7=removed
                  // x[9..10]: impedenza | x[11..12]: peso/200 kg
                  id(scale_stable) = (x[0] & 0x20) != 0;
                  id(scale_impedance) = (uint16_t)x[9] | ((uint16_t)x[10] << 8);
                  float w = ((uint16_t)x[11] | ((uint16_t)x[12] << 8)) / 200.0f;
                  if (w > 0 && w < 300) {
                    id(scale_weight) = w;
                    id(scale_profile) =
                        (w >= ${profile_threshold}) ? "${profile_heavy_name}"
                                                    : "${profile_light_name}";
                    id(my_display).show_page(id(page_scale));
                    id(my_display).update();
                  }
              - script.execute: standby_timeout

# SPI per il display LCD ST7789V
spi:
  clk_pin: GPIO7
  mosi_pin: GPIO6
  miso_pin: GPIO5   # opzionale, usato dallo slot SD

# Retroilluminazione LCD dimmerabile
output:
  - platform: ledc
    pin: GPIO22
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Retroilluminazione display"
    id: back_light
    restore_mode: RESTORE_DEFAULT_ON

  # LED RGB integrato (WS2812 su GPIO8)
  - platform: esp32_rmt_led_strip
    name: "LED RGB"
    pin: GPIO8
    channel_colors: RGB
    num_leds: 1
    chipset: ws2812
    restore_mode: RESTORE_DEFAULT_OFF

font:
  - file: 'BebasNeue-Regular.ttf'
    id: font_big
    size: 40

  - file: 'BebasNeue-Regular.ttf'
    id: font_small
    size: 18

  - file: 'arial.ttf'
    id: font_text
    size: 16

image:
  - file: "logo_looptech.png"
    id: logo_img
    type: RGB565
    resize: 200x82

# Refresh veloce solo durante lo splash (scritta animata)
interval:
  - interval: 120ms
    then:
      - if:
          condition:
            lambda: 'return id(splash_active);'
          then:
            - lambda: 'id(my_display).update();'

display:
  - platform: mipi_spi
    model: "WAVESHARE-ESP32-C6-LCD-1.47"
    # pin/dimensioni/offset gia' preimpostati dal modello:
    # cs=14, dc=15, rst=21, 172x320, offset_width=34
    rotation: 90        # landscape 320x172
    id: my_display
    update_interval: 1s
    pages:
      # Prima pagina = quella mostrata al boot: display spento di default
      - id: page_standby
        lambda: |-
          it.filled_rectangle(0, 0, it.get_width(), it.get_height(), Color::BLACK);

      # Splash landscape: logo in alto + scritta "LoopScale" animata
      - id: page_splash
        lambda: |-
          const int w = it.get_width();
          const int h = it.get_height();

          it.filled_rectangle(0, 0, w, h, Color::BLACK);

          // logo centrato nella parte alta
          it.image(w / 2, (h - 44) / 2, id(logo_img), ImageAlign::CENTER);

          // scritta typewriter: una lettera ogni 160ms + cursore lampeggiante
          const char *txt = "LoopScale";
          const int total = 9;
          int show = millis() / 160;
          if (show > total) show = total;
          std::string s(txt, show);
          if (show < total || (millis() % 700) < 350) s += "_";
          it.printf(80, h - 8, id(font_big), Color(140, 50, 190),
                    TextAlign::BASELINE_LEFT, "%s", s.c_str());

      - id: page_scale
        lambda: |-
          const float w = id(scale_weight);
          const bool stab = id(scale_stable);
          const int cw = it.get_width();
          const int ch = it.get_height();
          const int cx = cw / 2;

          it.filled_rectangle(0, 0, cw, ch, Color::BLACK);
          it.line(0, 28, cw, 28, Color(0, 180, 255));
          it.line(0, ch - 28, cw, ch - 28, Color(0, 180, 255));

          // Header: titolo + stato misura (... in corso / OK stabile)
          it.printf(6, 4, id(font_text), Color(0, 180, 255), TextAlign::TOP_LEFT, "BILANCIA");
          it.printf(cw - 6, 4, id(font_text), stab ? Color(0, 255, 120) : Color(255, 180, 0),
                    TextAlign::TOP_RIGHT, stab ? "OK" : "...");

          // Body: peso grande + unita'
          it.printf(cx + 30, ch / 2 + 4, id(font_big), Color(255, 255, 255),
                    TextAlign::BASELINE_RIGHT, "%.1f", w);
          it.printf(cx + 34, ch / 2 + 4, id(font_small), Color(160, 160, 160),
                    TextAlign::BASELINE_LEFT, "kg");

          // Body: profilo stimato
          it.printf(cx, ch - 44, id(font_text), Color(255, 220, 0),
                    TextAlign::BASELINE_CENTER, "%s", id(scale_profile).c_str());

          // Footer: impedenza
          it.printf(6, ch - 4, id(font_small), Color(160, 160, 160),
                    TextAlign::BASELINE_LEFT, "Imp:%d Ohm", id(scale_impedance));

button:
  - platform: template
    name: "Display: test BILANCIA"
    id: btn_show_page_scale
    on_press:
      - light.turn_on: back_light
      - lambda: |-
          id(my_display).show_page(id(page_scale));
          id(my_display).update();
      - script.execute: standby_timeout

script:
  # Standby: spegne retroilluminazione dopo 20s di inattivita'.
  # Ogni advertisement della bilancia lo ri-arma (mode: restart).
  - id: standby_timeout
    mode: restart
    then:
      - delay: 20s
      - lambda: |-
          id(my_display).show_page(id(page_standby));
          id(my_display).update();
      - light.turn_off: back_light

globals:
  - id: splash_active
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: miscale_last_hex
    type: std::string
    restore_value: no
    initial_value: '""'

  - id: scale_weight
    type: float
    restore_value: no
    initial_value: '0'

  - id: scale_impedance
    type: int
    restore_value: no
    initial_value: '0'

  - id: scale_stable
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: scale_profile
    type: std::string
    restore_value: no
    initial_value: '"--"'
