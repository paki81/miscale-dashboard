# display-posta migrato a ESP32-C6: tutte le funzioni originali (OLED, BLE proxy,
# ingest bilancia, HA API, OTA) + OpenThread Border Router sperimentale.
# Da compilare con ESPHome recente (componente openthread border_router, ESP-IDF >= 5.5.5).
#
# Nuovi secret da aggiungere in ESPHome → Secrets:
#   thread_tlv: "<TLV della rete Thread preferita, copiato da HA → Impostazioni → Thread>"

esphome:
  name: "display-posta"
  friendly_name: Oled
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(my_display).show_page(id(page_test));
          id(my_display).update();
      - delay: 5s
      - lambda: |-
          id(my_display).show_page(id(page_main));
          id(my_display).update();
      - script.execute: screensaver_arm

esp32:
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf

# IPv6 obbligatorio per il backbone Thread → Wi-Fi.
network:
  enable_ipv6: true

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: hpUZC7AO4Z04p99TbwcPvLahZF9ahq2MD0LK3Qt/6KE=
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  use_address: 192.168.4.150

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Esphome-Web-745428"
    password: !secret display_posta_ap_password

captive_portal:

# OpenThread Border Router (SPERIMENTALE): la radio 802.15.4 interna della C6
# funge da BR; la backbone verso la LAN è il Wi-Fi STA. Si aggancia alla rete
# Thread preferita di Home Assistant tramite il TLV.
openthread:
  border_router:
  device_type: FTD
  tlv: !secret thread_tlv
  force_dataset: true

# Bluetooth Proxy
bluetooth_proxy:
  active: true

http_request:
  timeout: 2s
  verify_ssl: false

esp32_ble_tracker:
  on_ble_service_data_advertise:
    - service_uuid: 181B
      mac_address: 5C:CA:D3:5D:8D:8D
      then:
        - if:
            condition:
              and:
                - wifi.connected:
                - lambda: |
                    if (x.size() != 13) return false;
                    char hex[27] = {0};
                    for (size_t i = 0; i < 13; i++) {
                      snprintf(hex + i * 2, 3, "%02x",
                               static_cast<unsigned int>(x[i]));
                    }
                    if (id(miscale_last_hex) == hex) return false;
                    id(miscale_last_hex) = hex;
                    return true;
            then:
              - http_request.post:
                  url: http://192.168.188.163:8800/api/ingest
                  request_headers:
                      Content-Type: application/json
                      X-Ingest-Token: !secret miscale_token
                  json:
                      data: !lambda return id(miscale_last_hex);
                      mac: !secret miscale_mac

sensor:
  - platform: homeassistant
    id: inside_temperature
    entity_id: sensor.ingresso_sensore_temperature

  - platform: homeassistant
    id: outside_temperature
    entity_id: sensor.desk_am2301_temperature

binary_sensor:
  - platform: homeassistant
    id: onvis_motion
    entity_id: binary_sensor.onvis_sms1_motion   # <-- adatta al tuo entity_id
    on_state:
      if:
        condition:
          lambda: 'return x;'
        then:
          - lambda: |-
              id(motion_active) = true;
              id(motion_frame) = 0;
              id(my_display).show_page(id(page_motion));
              id(my_display).update();
          - script.execute: motion_timeout
          - script.execute: screensaver_arm

text_sensor:
  - platform: homeassistant
    entity_id: sensor.sensore_posta
    name: "Posta State"
    id: sensore_posta
    on_value:
      then:
        - script.execute: wake_display

  - platform: homeassistant
    id: posta_oggi
    entity_id: counter.conta_posta
    on_value:
      then:
        - script.execute: wake_display

  - platform: homeassistant
    id: segnale_posta
    entity_id: sensor.mailbox_wifi_signal_percent

time:
  - platform: homeassistant
    id: esptime

# REMAPPING PIN S3 → C6 (esp32-c6-devkitc-1):
#   SDA 17 → GPIO6, SCL 18 → GPIO7, RST 21 → GPIO5
# Evitati: GPIO8/9 (strappo boot), GPIO12/13 (USB nativo), GPIO16/17 (UART0/console).
i2c:
  sda: GPIO6
  scl: GPIO7
  scan: false
  frequency: 100kHz

font:
  - file: 'slkscr.ttf'
    id: font1
    size: 12

  - file: 'BebasNeue-Regular.ttf'
    id: font2
    size: 26

  - file: 'BebasNeue-Regular.ttf'
    id: font4
    size: 12

  - file: 'arial.ttf'
    id: font3
    size: 14

  - file: 'materialdesignicons-webfont.ttf'
    id: icon_font_20
    size: 12
    glyphs: [
      "󰅣", # online
      "󰅤", # offline
      "󰔨", # posta in arrivo
      "󰶌", # posta chiusa
      "󰶈", # posta aperta
      "󰍀", # lucchetto aperto
      "󰍁", # lucchetto chiuso
      "󰑫", # wifi
    ]

  - file: 'materialdesignicons-webfont.ttf'
    id: icon_font_30
    size: 25
    glyphs: [
      "󰅣", # online
      "󰅤", # offline
      "󰔨", # posta in arrivo
      "󰶌", # posta chiusa
      "󰶈", # posta aperta
      "󰍀", # lucchetto aperto
      "󰍁", # lucchetto chiuso
      "󰑫", # wifi
    ]

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    reset_pin: GPIO5
    address: 0x3C
    id: my_display
    external_vcc: false
    contrast: 85%
    update_interval: 1s
    pages:
      - id: page_main
        lambda: |-
          // ---------- UTIL ----------
          const bool posta_unav = id(sensore_posta).state == "unavailable" || id(sensore_posta).state == "";
          const bool wifi_unav  = id(segnale_posta).state == "unavailable" || id(segnale_posta).state == "";
          const bool time_ok    = id(esptime).now().is_valid();

          std::string posta_state = id(sensore_posta).state;
          const bool posta_on  = posta_state == "on" || posta_state == "open" || posta_state == "aperta";
          const bool posta_off = posta_state == "off" || posta_state == "closed" || posta_state == "chiusa";

          // Wi‑Fi text trimming (max 4 chars)
          std::string wifi_txt = id(segnale_posta).state.c_str();
          if (wifi_txt.size() > 4) wifi_txt = wifi_txt.substr(0, 4);

          // Pixel shift (anti burn-in): piccoli offset 0/1 px
          const int ox = id(px_shift);
          const int oy = id(py_shift);

          // ---------- CANVAS CLEAR ----------
          it.filled_rectangle(0, 0, 128, 64, Color::BLACK);

          // ---------- LAYOUT ----------
          it.line(0, 12, 128, 12); // header divider (no shift per bordi)
          it.line(0, 56, 128, 56); // footer divider

          // Header: time + wifi
          if (time_ok) {
            it.strftime(2 + ox, 0 + oy, id(font3), TextAlign::TOP_LEFT, "%H:%M", id(esptime).now());
          } else {
            it.printf(2 + ox, 0 + oy, id(font3), TextAlign::TOP_LEFT, "--:--");
          }
          it.printf(92 + ox, 0 + oy, id(icon_font_20), TextAlign::TOP_LEFT, "󰑫");
          if (wifi_unav) {
            it.printf(126 - ox, 0 + oy, id(icon_font_20), TextAlign::TOP_RIGHT, "󰅤");
          } else {
            it.printf(126 - ox, 1 + oy, id(font1), TextAlign::TOP_RIGHT, "%s%%", wifi_txt.c_str());
          }

          // Body: title + state
          it.printf(64 + ox, 35 + oy, id(font2), TextAlign::BASELINE_CENTER, "POSTA");
          if (posta_unav) {
            it.printf(64 + ox, 52 + oy, id(font3), TextAlign::BASELINE_CENTER, "Sconosciuta");
          } else if (posta_on) {
            it.printf(64 + ox, 52 + oy, id(font3), TextAlign::BASELINE_CENTER, "Aperta");
          } else if (posta_off) {
            it.printf(64 + ox, 52 + oy, id(font3), TextAlign::BASELINE_CENTER, "Chiusa");
          } else {
            it.printf(64 + ox, 52 + oy, id(font3), TextAlign::BASELINE_CENTER, "%s", posta_state.c_str());
          }

          // Footer: counter
          it.printf(2 + ox, 63 + oy, id(font4), TextAlign::BASELINE_LEFT, "Oggi:");
          it.printf(126 - ox, 63 + oy, id(font2), TextAlign::BASELINE_RIGHT, "%s", id(posta_oggi).state.c_str());

      - id: page_motion
        lambda: |-
          // Animazione "radar": cerchi concentrici che si espandono dal centro
          const int cx = 64;
          const int cy = 30;
          const int f = id(motion_frame);

          it.filled_rectangle(0, 0, 128, 64, Color::BLACK);

          for (int i = 0; i < 3; i++) {
            int r = ((f + i * 8) % 24) + 2;   // raggio 2..25
            it.circle(cx, cy, r);
          }
          // puntino centrale lampeggiante
          if ((f / 2) % 2 == 0) {
            it.filled_circle(cx, cy, 3);
          }

          it.printf(64, 63, id(font3), TextAlign::BASELINE_CENTER, "MOVIMENTO");

      - id: page_test
        lambda: |-
          // Test: accendi TUTTI i pixel (schermo completamente bianco)
          it.filled_rectangle(0, 0, 128, 64);

      - id: page_test_black
        lambda: |-
          // Test: spegni TUTTI i pixel (schermo completamente nero)
          it.filled_rectangle(0, 0, 128, 64, Color::BLACK);

      - id: page_test_checker
        lambda: |-
          // Test: checkerboard 50% per confronto di uniformità
          it.filled_rectangle(0, 0, 128, 64, Color::BLACK);
          for (int y = 0; y < 64; y += 2) {
            for (int x = (y % 4 == 0 ? 0 : 1); x < 128; x += 2) {
              it.draw_pixel_at(x, y);
            }
          }

button:
  - platform: template
    name: "Display: mostra pagina MAIN"
    id: btn_show_page_main
    on_press:
      - lambda: |-
          id(my_display).show_page(id(page_main));
          id(my_display).update();

  - platform: template
    name: "Display: test BIANCO"
    id: btn_show_test_white
    on_press:
      - lambda: |-
          id(my_display).show_page(id(page_test));
          id(my_display).update();

  - platform: template
    name: "Display: test NERO"
    id: btn_show_test_black
    on_press:
      - lambda: |-
          id(my_display).show_page(id(page_test_black));
          id(my_display).update();

  - platform: template
    name: "Display: test CHECKER"
    id: btn_show_test_checker
    on_press:
      - lambda: |-
          id(my_display).show_page(id(page_test_checker));
          id(my_display).update();

  - platform: template
    name: "Display: refresh (de-ghost)"
    id: btn_oled_refresh
    on_press:
      - script.execute: oled_refresh

script:
  - id: oled_refresh
    mode: restart
    then:
      - lambda: |-
          id(my_display).show_page(id(page_test));
          id(my_display).update();
      - delay: 300ms
      - lambda: |-
          id(my_display).show_page(id(page_test_black));
          id(my_display).update();
      - delay: 300ms
      - repeat:
          count: 6
          then:
            - lambda: |-
                id(my_display).show_page(id(page_test_checker));
                id(my_display).update();
            - delay: 300ms
            - lambda: |-
                id(my_display).show_page(id(page_test));
                id(my_display).update();
            - delay: 300ms
            - lambda: |-
                id(my_display).show_page(id(page_test_black));
                id(my_display).update();
            - delay: 300ms
      - lambda: |-
          id(my_display).show_page(id(page_main));
          id(my_display).update();

  - id: screensaver_arm
    mode: restart
    then:
      - delay: 60s
      - lambda: |-
          id(my_display).show_page(id(page_test_black));
          id(my_display).update();

  - id: wake_display
    mode: restart
    then:
      - lambda: |-
          id(my_display).show_page(id(page_main));
          id(my_display).update();
      - script.execute: screensaver_arm

  - id: motion_timeout
    mode: restart
    then:
      - delay: 10s
      - lambda: |-
          id(motion_active) = false;
          id(my_display).show_page(id(page_main));
          id(my_display).update();
      - script.execute: screensaver_arm

interval:
  - interval: 24h
    then:
      - script.execute: oled_refresh

  - interval: 60s
    then:
      - lambda: |-
          id(px_shift) = (id(px_shift) + 1) % 2;
          id(py_shift) = (id(py_shift) + 1) % 2;

  - interval: 100ms
    then:
      - if:
          condition:
            lambda: 'return id(motion_active);'
          then:
            - lambda: |-
                id(motion_frame)++;
                id(my_display).update();

globals:
  - id: px_shift
    type: int
    restore_value: no
    initial_value: '0'

  - id: py_shift
    type: int
    restore_value: no
    initial_value: '0'

  - id: motion_active
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: motion_frame
    type: int
    restore_value: no
    initial_value: '0'

  - id: miscale_last_hex
    type: std::string
    restore_value: no
    initial_value: '""'
